<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>
  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg" class="header-image" />
      <a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <main class="main-content">
      <section class="add-item-section">
        <h3 class="section-titles">Add item</h3>
        <div class="add-item-wrapper">
          <input id="new-task" class="task add-inputs" type="text" />
          <button class="button">Add</button>
        </div>
      </section>
      <section class="task-list">
        <h3 class="section-titles">Todo</h3>
        <ul id="incomplete-tsks" class="task-lists">
          <li class="task-item">
            <input type="checkbox" class="checkbox" />
            <label class="task task-item-label">Pay bills</label>
            <input type="text" class="task text-inputs" />
            <button class="edit button">Edit</button>
            <button class="delete">
              <img src="./remove.svg" class="delete-image" />
            </button>
          </li>

          <li class="task-item editmode">
            <input type="checkbox" class="checkbox" />
            <label class="task task-item-label">Go shopping</label>
            <input type="text" value="Go shopping" class="task text-inputs" />
            <button class="edit button">Save</button>
            <button class="delete">
              <img src="./remove.svg" class="delete-image" />
            </button>
          </li>
        </ul>
      </section>
      <section class="task-list">
        <h3 class="section-titles">Completed</h3>
        <ul id="completed-tasks" class="task-lists">
          <li class="task-item">
            <input type="checkbox" class="checkbox" checked />
            <label class="task task-item-label complated-label"
              >See the doctor</label
            >
            <input type="text" class="task text-inputs" />
            <button class="edit button">Edit</button>
            <button class="delete">
              <img src="./remove.svg" class="delete-image" />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
